name: Deploy Cloudflare Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Require successful CI-equivalent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run deploy:dry-run

  deploy:
    name: Publish Worker and static assets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment and runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_READ_TOKEN: ${{ secrets.CF_API_READ_TOKEN }}
          ACCESS_ISSUER: ${{ secrets.ACCESS_ISSUER }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_READ_TOKEN ACCESS_ISSUER ACCESS_AUD; do
            if [[ -z "${!name}" ]]; then echo "Missing GitHub secret: ${name}" >&2; exit 1; fi
          done
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hex ID" >&2; exit 1; }
          node --input-type=module -e 'const u=new URL(process.env.ACCESS_ISSUER); if(u.protocol!=="https:" || u.pathname!=="/" || u.search || u.hash || u.username || u.password) process.exit(1)' 
      - name: Deploy Worker and set runtime-only secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy
          secrets: |
            CF_API_READ_TOKEN
            CF_ACCOUNT_ID
            ACCESS_ISSUER
            ACCESS_AUD
        env:
          CF_API_READ_TOKEN: ${{ secrets.CF_API_READ_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ISSUER: ${{ secrets.ACCESS_ISSUER }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
