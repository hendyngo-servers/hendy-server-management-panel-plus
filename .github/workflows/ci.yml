name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Worker and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Syntax and unit tests
        run: npm run check
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Validate Worker upload
        run: npm run deploy:dry-run
